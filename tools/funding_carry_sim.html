<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ファンディング金利・サヤ取り年利計算機</title><style>body{font-family:sans-serif;background:#050811;color:#f8fafc;padding:24px;}.b{max-width:660px;margin:0 auto;background:#111827;border:1px solid #eab308;border-radius:14px;padding:24px;}input,button{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;margin:6px 0 12px 0;font-size:1rem;}input{background:#0f172a;color:#fff;border:1px solid #334155;}button{background:#eab308;color:#422006;border:none;font-weight:bold;cursor:pointer;}</style></head><body><div class='b'><h2 style='margin-top:0;color:#eab308;'>📈 暗号資産ファンディング金利・実質年利(APR)計算機</h2><label>運用想定元本(円)<input id='cap' type='number' value='500000'></label><label>8時間あたり金利(% / 直近参考: 0.01%)<input id='fr' type='number' step='0.001' value='0.01'></label><label>保有日数(日)<input id='d' type='number' value='90'></label><button onclick='go()'>往復手数料控除後の実質利回りを計算</button><div id='o' style='padding:12px;background:#0f172a;border-radius:8px;'></div><p style='margin-top:14px;font-size:0.9rem;'><a href='../claim.html' style='color:#10b981;font-weight:bold;'>📦 自動監視＆計算Pythonキット(VENTURE-004)を入手</a> ｜ <a href='../index.html' style='color:#94a3b8;'>ストアへ戻る</a></p></div><script>function go(){const cap=+document.getElementById('cap').value||0,fr=+document.getElementById('fr').value||0,d=+document.getElementById('d').value||30;const net=Math.round(cap*(fr/100)*3*d - cap*0.0024),apr=cap>0?((net/cap)*(365/Math.max(1,d))*100).toFixed(2):0;document.getElementById('o').innerHTML=`期間純収益目安: <b style='color:#10b981;font-size:1.2rem;'>¥${net.toLocaleString()}</b> ／ 実質年換算利回り: <b style='color:#facc15;'>${apr}% APR</b>`;}go();</script></body></html>
