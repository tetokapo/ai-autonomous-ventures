<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>パーソナルPFC・目標カロリー自動設計ツール（無料Web版）</title><style>body{font-family:'Segoe UI',Meiryo,sans-serif;background:#050811;color:#f8fafc;padding:24px;line-height:1.6;}.b{max-width:680px;margin:0 auto;background:#111827;border:1px solid #10b981;border-radius:14px;padding:24px;}input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155;margin:6px 0 12px 0;font-size:1rem;}button{width:100%;background:#10b981;color:#052e16;border:none;padding:12px;border-radius:8px;font-weight:bold;font-size:1rem;cursor:pointer;}</style></head><body><div class='b'><h1 style='margin-top:0;color:#10b981;font-size:1.3rem;'>💪 パーソナルPFCバランス＆TDEE設計ツール（無料Web版）</h1><label>体重(kg)<input id='w' type='number' value='70'></label><label>身長(cm)<input id='h' type='number' value='173'></label><label>年齢<input id='a' type='number' value='28'></label><label>活動係数 × 目的調整(kcal)<select id='g'><option value='350'>増量・筋肥大 (+350 kcal)</option><option value='0'>維持・リコンプ (±0 kcal)</option><option value='-450'>減量・除脂肪 (-450 kcal)</option></select></label><button onclick='pfc()'>1日の最適カロリー＆PFCグラム数を算出</button><div id='res' style='margin-top:16px;padding:14px;background:#0f172a;border-radius:10px;'></div><div style='margin-top:18px;padding-top:14px;border-top:1px solid #1f2937;'><p style='margin:0 0 8px 0;font-size:0.9rem;color:#cbd5e1;'>📦 Python習慣KPI出力＆クライアント管理キット（VENTURE-003 / ¥2,480）:</p><a href='../claim.html' style='color:#38bdf8;font-weight:bold;'>👉 自動設計スクリプトキットを入手する</a> ｜ <a href='../index.html' style='color:#94a3b8;'>ストアへ戻る</a></div></div><script>function pfc(){const w=+document.getElementById('w').value||70,h=+document.getElementById('h').value||170,a=+document.getElementById('a').value||28,g=+document.getElementById('g').value||0;const kcal=Math.round((10*w+6.25*h-5*a+5)*1.55+g),p=Math.round(w*2.2),f=Math.round(kcal*0.22/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));document.getElementById('res').innerHTML=`目標摂取エネルギー: <strong style='color:#facc15;font-size:1.25rem;'>${kcal.toLocaleString()} kcal / 日</strong><br>P(タンパク質): <strong>${p}g</strong> ／ F(脂質): <strong>${f}g</strong> ／ C(炭水化物): <strong>${c}g</strong>`;}pfc();</script></body></html>
