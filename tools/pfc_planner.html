<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>パーソナルPFC・目標カロリー設計ツール</title><style>body{font-family:sans-serif;background:#050811;color:#f8fafc;padding:24px;}.b{max-width:660px;margin:0 auto;background:#111827;border:1px solid #10b981;border-radius:14px;padding:24px;}input,select,button{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;margin:6px 0 12px 0;font-size:1rem;}input,select{background:#0f172a;color:#fff;border:1px solid #334155;}button{background:#10b981;color:#052e16;border:none;font-weight:bold;cursor:pointer;}</style></head><body><div class='b'><h2 style='margin-top:0;color:#10b981;'>💪 パーソナルPFC＆TDEEカロリー設計機</h2><label>体重(kg)<input id='w' type='number' value='70'></label><label>身長(cm)<input id='h' type='number' value='173'></label><label>目的調整(kcal)<select id='g'><option value='350'>増量 (+350kcal)</option><option value='0'>維持 (±0kcal)</option><option value='-450'>減量 (-450kcal)</option></select></label><button onclick='go()'>PFCバランスを算出</button><div id='o' style='padding:12px;background:#0f172a;border-radius:8px;'></div><p style='margin-top:14px;font-size:0.9rem;'><a href='../claim.html' style='color:#38bdf8;font-weight:bold;'>📦 Python管理キット(VENTURE-003)を入手</a> ｜ <a href='../index.html' style='color:#94a3b8;'>ストアへ戻る</a></p></div><script>function go(){const w=+document.getElementById('w').value||70,h=+document.getElementById('h').value||173,g=+document.getElementById('g').value||0,k=Math.round((10*w+6.25*h-140+5)*1.55+g),p=Math.round(w*2.2),f=Math.round(k*0.22/9),c=Math.max(0,Math.round((k-p*4-f*9)/4));document.getElementById('o').innerHTML=`目標: <b style='color:#facc15;font-size:1.2rem;'>${k} kcal/日</b> (P:${p}g / F:${f}g / C:${c}g)`;}go();</script></body></html>
