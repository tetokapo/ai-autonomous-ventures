<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>暗号資産の手取り・総合課税シミュレーター＆CSV集計キット V1</title><style>body{font-family:'Segoe UI',Meiryo,sans-serif;background:#050811;color:#f8fafc;padding:24px;line-height:1.6;}.b{max-width:660px;margin:0 auto;background:#111827;border:1px solid #10b981;border-radius:14px;padding:24px;}input,button{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;margin:8px 0 14px 0;font-size:1rem;}input{background:#0f172a;color:#fff;border:1px solid #334155;}button{background:#10b981;color:#052e16;border:none;font-weight:bold;cursor:pointer;}</style></head><body><div class='b'><h2 style='margin-top:0;color:#10b981;font-size:1.25rem;'>🚀 暗号資産の手取り・総合課税シミュレーター＆CSV集計キット V1 (無料Web計算機)</h2><label>暗号資産の年間実現利益 (円・給与課税300万想定)<input id='v' type='number' value='500000'></label><button onclick='calc()'>即時計算を実行</button><div id='o' style='padding:14px;background:#0f172a;border-radius:8px;color:#38bdf8;font-weight:bold;'></div><p style='margin-top:16px;font-size:0.9rem;'><a href='../claim.html' style='color:#facc15;font-weight:bold;'>📦 Python自動化フルキット(VENTURE-002)を入手</a> ｜ <a href='../index.html' style='color:#94a3b8;'>ストア一覧へ</a></p></div><script>function calc(){const v=+document.getElementById('v').value||0;document.getElementById('o').innerHTML=`増加税額目安: ¥${Math.floor(v*0.304).toLocaleString()} / 税引後手取り目安: ¥${Math.floor(v*0.696).toLocaleString()}`;}calc();</script></body></html>
