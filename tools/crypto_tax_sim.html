<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>暗号資産の手取り・総合課税シミュレーター（無料Web版）</title><style>body{font-family:'Segoe UI',Meiryo,sans-serif;background:#050811;color:#f8fafc;padding:24px;line-height:1.6;}.b{max-width:680px;margin:0 auto;background:#111827;border:1px solid #38bdf8;border-radius:14px;padding:24px;}input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155;margin:6px 0 14px 0;font-size:1rem;}button{width:100%;background:#38bdf8;color:#082f49;border:none;padding:12px;border-radius:8px;font-weight:bold;font-size:1rem;cursor:pointer;}</style></head><body><div class='b'><h1 style='margin-top:0;color:#38bdf8;font-size:1.3rem;'>🧮 暗号資産の総合課税・手取り額シミュレーター（無料ツール）</h1><label>給与などの課税所得金額（円）<input id='sal' type='number' value='3000000'></label><label>今年の暗号資産 実現利益（円）<input id='cry' type='number' value='500000'></label><button onclick='calc()'>手取り残額と増加税額を即時試算</button><div id='out' style='margin-top:16px;padding:14px;background:#0f172a;border-radius:10px;'></div><div style='margin-top:18px;padding-top:14px;border-top:1px solid #1f2937;'><p style='margin:0 0 8px 0;font-size:0.9rem;color:#cbd5e1;'>📦 CSV自動集計・Python一括試算キット（VENTURE-002 / ¥3,980）はこちら:</p><a href='../claim.html' style='color:#10b981;font-weight:bold;'>👉 フル自動化キットを入手する</a> ｜ <a href='../index.html' style='color:#94a3b8;'>ストアへ戻る</a></div></div><script>function itax(t){t=Math.max(0,Math.floor(t/1000)*1000);const b=[[1950000,.05,0],[3300000,.1,97500],[6950000,.2,427500],[9000000,.23,636000],[18000000,.33,1536000],[40000000,.4,2796000],[1e12,.45,4796000]];for(const[c,r,d]of b)if(t<=c)return Math.floor(t*r-d);return 0;}function calc(){const s=+document.getElementById('sal').value||0,c=+document.getElementById('cry').value||0;const di=Math.floor((itax(s+c)-itax(s))*1.021),dr=Math.floor(c*0.10),tot=di+dr,net=c-tot;document.getElementById('out').innerHTML=`増加税額目安(所得税+住民税10%): <strong style='color:#f43f5e;'>¥${tot.toLocaleString()}</strong><br>税引後の手取り残額: <strong style='color:#10b981;font-size:1.25rem;'>¥${net.toLocaleString()}</strong>`;}calc();</script></body></html>
