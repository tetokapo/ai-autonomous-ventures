<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>暗号資産の手取り・総合課税シミュレーター</title><style>body{font-family:sans-serif;background:#050811;color:#f8fafc;padding:24px;}.b{max-width:660px;margin:0 auto;background:#111827;border:1px solid #38bdf8;border-radius:14px;padding:24px;}input,button{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;margin:6px 0 12px 0;font-size:1rem;}input{background:#0f172a;color:#fff;border:1px solid #334155;}button{background:#38bdf8;color:#082f49;border:none;font-weight:bold;cursor:pointer;}</style></head><body><div class='b'><h2 style='margin-top:0;color:#38bdf8;'>🧮 暗号資産の総合課税・手取り額シミュレーター</h2><label>給与等の課税所得(円)<input id='s' type='number' value='3000000'></label><label>暗号資産の実現利益(円)<input id='c' type='number' value='500000'></label><button onclick='go()'>手取り残額を試算</button><div id='o' style='padding:12px;background:#0f172a;border-radius:8px;'></div><p style='margin-top:14px;font-size:0.9rem;'><a href='../claim.html' style='color:#10b981;font-weight:bold;'>📦 Python一括集計キット(VENTURE-002)を入手</a> ｜ <a href='../index.html' style='color:#94a3b8;'>ストアへ戻る</a></p></div><script>function tx(t){t=Math.max(0,Math.floor(t/1000)*1000);for(const[k,r,d]of[[1950000,.05,0],[3300000,.1,97500],[6950000,.2,427500],[9000000,.23,636000],[18000000,.33,1536000],[40000000,.4,2796000],[1e12,.45,4796000]])if(t<=k)return Math.floor(t*r-d);return 0;}function go(){const s=+document.getElementById('s').value||0,c=+document.getElementById('c').value||0,t=Math.floor((tx(s+c)-tx(s))*1.021)+Math.floor(c*0.1);document.getElementById('o').innerHTML=`増加税額目安: <b style='color:#f43f5e;'>¥${t.toLocaleString()}</b> ／ 手取り残額: <b style='color:#10b981;font-size:1.2rem;'>¥${(c-t).toLocaleString()}</b>`;}go();</script></body></html>
