<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><title>動的WebCrypto即納金庫</title><style>body{font-family:sans-serif;background:#050811;color:#f8fafc;padding:32px;}.b{max-width:580px;margin:20px auto;background:#111827;border:1px solid #10b981;border-radius:12px;padding:24px;}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;margin-top:10px;font-size:1rem;}input{background:#0f172a;color:#fff;border:1px solid #334155;font-family:monospace;}button{background:#10b981;color:#052e16;border:none;font-weight:bold;cursor:pointer;}</style></head><body><div class='b'><h2 style='margin-top:0;color:#10b981;'>🔐 動的カタログ対応 WebCrypto 即時復号金庫</h2><p style='font-size:0.88rem;color:#cbd5e1;'>発行された解除パスキー（<code>AV1-...</code> 〜 <code>AV99-...</code>）を入力すると自動で対象パッケージを特定しブラウザ復号します。</p><input id='pk' placeholder='AV1-XXXX-XXXX-XXXX'><button onclick='go()'>🔓 検証してZIPをダウンロード</button><p id='m' style='color:#38bdf8;'></p><a href='index.html' style='color:#94a3b8;font-size:0.85rem;'>← ストアへ戻る</a></div><script>const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function go(){const m=document.getElementById('m'),p=document.getElementById('pk').value.trim().toUpperCase();if(!p)return;m.textContent='カタログ照合中...';try{const cat=await(await fetch('vault/catalog.json?t='+Date.now())).json(),pref=p.split('-')[0],ent=cat[pref];if(!ent){m.style.color='#f43f5e';m.textContent='❌ 未対応のキー形式です';return;}const v=await(await fetch(ent.vault+'?t='+Date.now())).json(),iv=B(v.iv_b64),ct=B(v.ct_b64);const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:B(v.salt_b64),iterations:v.iterations,hash:'SHA-256'},bk,512);const mi=new Uint8Array(iv.length+ct.length);mi.set(iv,0);mi.set(ct,iv.length);const hk=await crypto.subtle.importKey('raw',new Uint8Array(bits,32,32),{name:'HMAC',hash:'SHA-256'},false,['verify']);if(!(await crypto.subtle.verify('HMAC',hk,B(v.mac_b64),mi))){m.style.color='#f43f5e';m.textContent='❌ パスキーが一致しません';return;}const ak=await crypto.subtle.importKey('raw',new Uint8Array(bits,0,32),{name:'AES-CBC'},false,['decrypt']);const pl=await crypto.subtle.decrypt({name:'AES-CBC',iv},ak,ct);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pl],{type:'application/zip'}));a.download=v.filename;a.click();m.style.color='#10b981';m.textContent='✅ '+v.filename+' の復号完了！';}catch(e){m.textContent='エラー:'+e.message;}}</script></body></html>
